name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build DeepFind.slnx -c Release
      - run: dotnet test DeepFind.slnx -c Release --no-build
      - run: dotnet list DeepFind.slnx package --vulnerable --include-transitive
      - run: dotnet publish src/DeepFind.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
      - run: dotnet build installer/DeepFind.Installer.wixproj -c Release
      - name: Install, launch, and uninstall DeepFind
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem installer/bin -Recurse -Filter DeepFind-Setup-x64.msi)
          if ($msi.Count -ne 1) { throw "Expected one DeepFind installer, found $($msi.Count)." }

          function Invoke-Installer($operation, $log, $properties = "") {
            $arguments = "$operation `"$($msi[0].FullName)`" /quiet /norestart /log `"$env:RUNNER_TEMP/$log`" $properties"
            $result = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Windows Installer returned $($result.ExitCode). See $log." }
          }

          $application = Join-Path $env:LOCALAPPDATA 'Programs/DeepFind/DeepFind.App.exe'
          Invoke-Installer /i deepfind-install.log
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Programs')) 'DeepFind.lnk'
          $desktopPath = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'DeepFind.lnk'
          try {
            if (Test-Path $desktopPath) { throw "Silent default unexpectedly created a Desktop shortcut." }
            if (-not (Test-Path $shortcutPath)) { throw "Start Menu shortcut is missing: $shortcutPath" }
            $shell = New-Object -ComObject WScript.Shell
            $shortcut = $shell.CreateShortcut($shortcutPath)
            if ($shortcut.TargetPath -ne $application -or -not (Test-Path $shortcut.TargetPath)) {
              throw "Start Menu shortcut target does not resolve to the installed application."
            }
            $process = Start-Process $shortcut.TargetPath -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(45)
              do {
                $process.Refresh()
                if ($process.HasExited) { throw "DeepFind exited during startup with code $($process.ExitCode)." }
                if ($process.MainWindowHandle -ne 0 -and $process.MainWindowTitle -eq 'DeepFind') { break }
                Start-Sleep -Milliseconds 250
              } while ((Get-Date) -lt $deadline)
              if ($process.MainWindowHandle -eq 0 -or $process.MainWindowTitle -ne 'DeepFind') {
                throw "DeepFind did not open its main window."
              }
              if (-not $process.CloseMainWindow()) { throw "DeepFind window rejected the close request." }
              if (-not $process.WaitForExit(15000)) { throw "DeepFind stayed alive after close." }
              if ($process.ExitCode -ne 0) { throw "DeepFind exited with code $($process.ExitCode) after closing." }
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
            & powershell.exe -NoProfile -File tests/WindowsUiSmoke.ps1 -Application $application
            if ($LASTEXITCODE -ne 0) { throw "Windows UI smoke failed." }
          } finally {
            Invoke-Installer /x deepfind-uninstall.log
          }
          if (Test-Path $application) { throw "DeepFind executable remained after uninstall." }
          if (Test-Path $shortcutPath) { throw "DeepFind Start Menu shortcut remained after uninstall." }
          Invoke-Installer /i deepfind-desktop-install.log "DESKTOPSHORTCUT=1"
          try {
            if (-not (Test-Path $desktopPath)) { throw "Silent Desktop opt-in did not create a shortcut." }
            $desktopLink = $shell.CreateShortcut($desktopPath)
            if ($desktopLink.TargetPath -ne $application) { throw "Desktop shortcut has an incorrect target." }
          } finally {
            Invoke-Installer /x deepfind-desktop-uninstall.log
          }
          if (Test-Path $desktopPath) { throw "Owned Desktop shortcut remained after uninstall." }
      - name: Collect app logs on failure
        if: failure()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'DeepFind/Logs'
          if (Test-Path $logs) { Copy-Item (Join-Path $logs '*.log') $env:RUNNER_TEMP -ErrorAction SilentlyContinue }
      - name: Upload installer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: |
            ${{ runner.temp }}/deepfind-*.log
            ${{ runner.temp }}/app-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: DeepFind-Setup-x64
          path: installer/bin/**/DeepFind-Setup-x64.msi
          if-no-files-found: error
